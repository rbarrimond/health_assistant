  <text x="304" y="360" fill="#9ca3af" font-family="Arial, sans-serif" font-size="13">Avg Power: 214W</text>
  <text x="304" y="384" fill="#9ca3af" font-family="Arial, sans-serif" font-size="13">NP: 238W</text>
  <text x="304" y="408" fill="#9ca3af" font-family="Arial, sans-serif" font-size="13">IF: 0.82</text>
  <text x="304" y="432" fill="#9ca3af" font-family="Arial, sans-serif" font-size="13">TSS: 122</text>
  <rect x="304" y="452" width="180" height="28" rx="7" fill="#052e2b" stroke="#0f766e"/>
  <text x="322" y="471" fill="#34d399" font-family="Arial, sans-serif" font-size="12">Parser confidence: high</text>

  <rect x="730" y="274" width="450" height="220" rx="14" fill="#0f172a" stroke="#1f2937" filter="url(#opsShadow)"/>
  <text x="754" y="306" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="18" font-weight="700">Alerts &amp; Flags</text>
  <circle cx="758" cy="336" r="5" fill="#f59e0b"/>
  <text x="772" y="340" fill="#d1d5db" font-family="Arial, sans-serif" font-size="13">HR drift over threshold (Block 2)</text>
  <circle cx="758" cy="364" r="5" fill="#f59e0b"/>
  <text x="772" y="368" fill="#d1d5db" font-family="Arial, sans-serif" font-size="13">Cadence drop final 15 min</text>
  <circle cx="758" cy="392" r="5" fill="#10b981"/>
  <text x="772" y="396" fill="#d1d5db" font-family="Arial, sans-serif" font-size="13">No data gap anomalies</text>
  <rect x="754" y="420" width="190" height="30" rx="8" fill="#3f1d1d" stroke="#7f1d1d"/>
  <text x="770" y="439" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12">Escalation policy: not triggered</text>

  <rect x="280" y="512" width="900" height="228" rx="14" fill="#0f172a" stroke="#1f2937" filter="url(#opsShadow)"/>
  <text x="304" y="544" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="18" font-weight="700">Grounded LLM Output</text>
  <text x="304" y="572" fill="#9ca3af" font-family="Arial, sans-serif" font-size="13">- Keep tomorrow easy Z2 to absorb this load.</text>
  <text x="304" y="594" fill="#9ca3af" font-family="Arial, sans-serif" font-size="13">- Increase fueling consistency beyond 90 minutes.</text>
  <text x="304" y="616" fill="#9ca3af" font-family="Arial, sans-serif" font-size="13">- Progress to 3x12 sweet spot with cadence stability target.</text>
  <text x="304" y="646" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="12">Sources: workout_doc_12, fatigue_guidelines_v3</text>
  <rect x="304" y="668" width="140" height="34" rx="8" fill="url(#opsbrand)"/>
  <text x="350" y="690" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Approve</text>
  <rect x="458" y="668" width="140" height="34" rx="8" fill="#111827" stroke="#374151"/>
  <text x="495" y="690" fill="#d1d5db" font-family="Arial, sans-serif" font-size="12" font-weight="700">Regenerate</text>
  <rect x="612" y="668" width="140" height="34" rx="8" fill="#111827" stroke="#374151"/>
  <text x="660" y="690" fill="#d1d5db" font-family="Arial, sans-serif" font-size="12" font-weight="700">Open Trace</text>
</svg>
