  <text x="372" y="224" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="13">8f1c-42ac-99de</text>
  <text x="560" y="224" fill="#9ca3af" font-family="Arial, sans-serif" font-size="13">Prompt</text>
  <text x="620" y="224" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="13">workout_v12</text>
  <text x="760" y="224" fill="#9ca3af" font-family="Arial, sans-serif" font-size="13">Latency</text>
  <text x="828" y="224" fill="#10b981" font-family="Arial, sans-serif" font-size="13" font-weight="700">2.8s</text>

