  <text x="90" y="54" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="24" font-weight="700">Health Assistant Ops</text>
  <text x="90" y="74" fill="#9ca3af" font-family="Arial, sans-serif" font-size="12">Runbook-focused dashboard for workout analysis pipelines</text>
  <rect x="1020" y="34" width="140" height="32" rx="8" fill="#1f2937"/>
  <text x="1057" y="55" fill="#d1d5db" font-family="Arial, sans-serif" font-size="13">On-call: ROB</text>

  <rect x="20" y="114" width="240" height="626" rx="14" fill="#0f172a" stroke="#1f2937" filter="url(#opsShadow)"/>
