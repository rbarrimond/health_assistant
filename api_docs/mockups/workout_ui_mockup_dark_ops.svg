  <rect x="36" y="252" width="208" height="34" rx="8" fill="#111827" stroke="#374151"/>
  <text x="50" y="274" fill="#d1d5db" font-family="Arial, sans-serif" font-size="13">Retrieval Trace</text>
  <rect x="36" y="296" width="208" height="34" rx="8" fill="#111827" stroke="#374151"/>
  <text x="50" y="318" fill="#d1d5db" font-family="Arial, sans-serif" font-size="13">Fallback Events</text>

  <text x="38" y="374" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="16" font-weight="700">System Health</text>
  <text x="38" y="402" fill="#9ca3af" font-family="Arial, sans-serif" font-size="12">API latency p95</text>
  <text x="156" y="402" fill="#10b981" font-family="Arial, sans-serif" font-size="12" font-weight="700">2.9s</text>
  <text x="38" y="424" fill="#9ca3af" font-family="Arial, sans-serif" font-size="12">Validation fail rate</text>
  <text x="156" y="424" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" font-weight="700">1.8%</text>
  <text x="38" y="446" fill="#9ca3af" font-family="Arial, sans-serif" font-size="12">RAG null answers</text>
  <text x="156" y="446" fill="#10b981" font-family="Arial, sans-serif" font-size="12" font-weight="700">0.7%</text>

  <rect x="280" y="114" width="900" height="142" rx="14" fill="#0f172a" stroke="#1f2937" filter="url(#opsShadow)"/>
