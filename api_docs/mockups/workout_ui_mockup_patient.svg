<svg width="1100" height="760" viewBox="0 0 1100 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Health Assistant patient-facing simplified mockup">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbfb"/>
      <stop offset="100%" stop-color="#edf3f4"/>
    </linearGradient>
    <linearGradient id="pbrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="pshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1100" height="760" fill="url(#pbg)"/>

  <rect x="24" y="20" width="1052" height="92" rx="18" fill="url(#pbrand)" filter="url(#pshadow)"/>
  <text x="52" y="58" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Health Assistant</text>
  <text x="52" y="86" fill="#d1fae5" font-family="Arial, sans-serif" font-size="14">Your weekly workout check-in</text>
  <rect x="900" y="44" width="150" height="42" rx="11" fill="#ffffff" opacity="0.2"/>
  <text x="944" y="70" fill="#ffffff" font-family="Arial, sans-serif" font-size="14">My Plan</text>

  <rect x="24" y="132" width="1052" height="130" rx="16" fill="#ffffff" filter="url(#pshadow)"/>
  <text x="52" y="166" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Today&apos;s Summary</text>
  <text x="52" y="196" fill="#334155" font-family="Arial, sans-serif" font-size="16">You completed a strong endurance ride with controlled effort.</text>
  <text x="52" y="222" fill="#334155" font-family="Arial, sans-serif" font-size="16">Recovery signals are good. Keep tomorrow easy to absorb training load.</text>

  <rect x="24" y="282" width="340" height="190" rx="16" fill="#ffffff" filter="url(#pshadow)"/>
  <text x="48" y="318" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Effort</text>
  <text x="48" y="350" fill="#334155" font-family="Arial, sans-serif" font-size="15">Duration: 1h 42m</text>
  <text x="48" y="376" fill="#334155" font-family="Arial, sans-serif" font-size="15">Intensity: Moderate-High</text>
  <text x="48" y="402" fill="#334155" font-family="Arial, sans-serif" font-size="15">Training Load: 122 TSS</text>
  <rect x="48" y="426" width="180" height="30" rx="8" fill="#ecfeff" stroke="#99f6e4"/>
  <text x="68" y="446" fill="#0f766e" font-family="Arial, sans-serif" font-size="13" font-weight="700">On track this week</text>

  <rect x="380" y="282" width="340" height="190" rx="16" fill="#ffffff" filter="url(#pshadow)"/>
  <text x="404" y="318" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Body Signals</text>
  <circle cx="408" cy="348" r="5" fill="#10b981"/>
  <text x="424" y="353" fill="#334155" font-family="Arial, sans-serif" font-size="15">Good pacing control overall</text>
  <circle cx="408" cy="376" r="5" fill="#f59e0b"/>
  <text x="424" y="381" fill="#334155" font-family="Arial, sans-serif" font-size="15">Mild HR drift in middle block</text>
  <circle cx="408" cy="404" r="5" fill="#10b981"/>
  <text x="424" y="409" fill="#334155" font-family="Arial, sans-serif" font-size="15">Recovered well at finish</text>

  <rect x="736" y="282" width="340" height="190" rx="16" fill="#ffffff" filter="url(#pshadow)"/>
  <text x="760" y="318" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Next Step</text>
  <text x="760" y="350" fill="#334155" font-family="Arial, sans-serif" font-size="15">Tomorrow: Easy Zone 2</text>
  <text x="760" y="376" fill="#334155" font-family="Arial, sans-serif" font-size="15">Fuel: 60-75g carbs/hr</text>
  <text x="760" y="402" fill="#334155" font-family="Arial, sans-serif" font-size="15">Hydration: +500ml/hr baseline</text>
  <rect x="760" y="426" width="170" height="30" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="784" y="446" fill="#15803d" font-family="Arial, sans-serif" font-size="13" font-weight="700">Ready for next session</text>

  <rect x="24" y="494" width="1052" height="170" rx="16" fill="#ffffff" filter="url(#pshadow)"/>
  <text x="52" y="530" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Coach Note</text>
  <text x="52" y="560" fill="#334155" font-family="Arial, sans-serif" font-size="16">Nice consistency. Keep your easy day easy, then return to quality work after recovery.</text>
  <text x="52" y="586" fill="#334155" font-family="Arial, sans-serif" font-size="16">Priority this week: stable cadence in longer tempo intervals.</text>
  <rect x="52" y="608" width="180" height="38" rx="10" fill="url(#pbrand)"/>
  <text x="105" y="632" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">View Plan</text>
  <rect x="248" y="608" width="190" height="38" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="305" y="632" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="700">Message Coach</text>

  <text x="24" y="712" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Generated with deterministic workout analysis + grounded AI summary</text>
</svg>
