<svg width="420" height="920" viewBox="0 0 420 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Health Assistant mobile workout analysis mockup">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7f7"/>
      <stop offset="100%" stop-color="#e6ecef"/>
    </linearGradient>
    <linearGradient id="brandm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="420" height="920" fill="url(#bgm)"/>

  <rect x="16" y="16" width="388" height="88" rx="16" fill="url(#brandm)" filter="url(#sm)"/>
  <text x="36" y="52" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Health Assistant</text>
  <text x="36" y="76" fill="#d1fae5" font-family="Arial, sans-serif" font-size="13">Mobile Workout View</text>

  <rect x="16" y="120" width="388" height="150" rx="14" fill="#ffffff" filter="url(#sm)"/>
  <text x="32" y="148" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Upload &amp; Analyze</text>
  <rect x="32" y="166" width="356" height="38" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="190" fill="#64748b" font-family="Arial, sans-serif" font-size="12">2026-02-13-endurance.fit</text>
  <rect x="32" y="218" width="356" height="38" rx="9" fill="url(#brandm)"/>
  <text x="156" y="242" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Run Analysis</text>

  <rect x="16" y="286" width="388" height="120" rx="14" fill="#ffffff" filter="url(#sm)"/>
  <text x="32" y="314" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Summary</text>
  <text x="32" y="340" fill="#334155" font-family="Arial, sans-serif" font-size="13">Controlled aerobic session, steady pacing,</text>
  <text x="32" y="360" fill="#334155" font-family="Arial, sans-serif" font-size="13">mild HR drift mid-session, strong finish.</text>
  <text x="32" y="384" fill="#0f766e" font-family="Arial, sans-serif" font-size="12" font-weight="700">Grounded with deterministic checks</text>

  <rect x="16" y="422" width="186" height="170" rx="14" fill="#ffffff" filter="url(#sm)"/>
  <text x="30" y="450" fill="#0f172a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Metrics</text>
  <text x="30" y="475" fill="#334155" font-family="Arial, sans-serif" font-size="12">Duration: 1h 42m</text>
  <text x="30" y="497" fill="#334155" font-family="Arial, sans-serif" font-size="12">Avg Power: 214W</text>
  <text x="30" y="519" fill="#334155" font-family="Arial, sans-serif" font-size="12">NP: 238W</text>
  <text x="30" y="541" fill="#334155" font-family="Arial, sans-serif" font-size="12">IF: 0.82</text>
  <text x="30" y="563" fill="#334155" font-family="Arial, sans-serif" font-size="12">TSS: 122</text>

  <rect x="218" y="422" width="186" height="170" rx="14" fill="#ffffff" filter="url(#sm)"/>
  <text x="232" y="450" fill="#0f172a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Flags</text>
  <circle cx="234" cy="475" r="4" fill="#f59e0b"/>
  <text x="244" y="479" fill="#334155" font-family="Arial, sans-serif" font-size="11">HR drift over target</text>
  <circle cx="234" cy="499" r="4" fill="#f59e0b"/>
  <text x="244" y="503" fill="#334155" font-family="Arial, sans-serif" font-size="11">Cadence drop late</text>
  <circle cx="234" cy="523" r="4" fill="#10b981"/>
  <text x="244" y="527" fill="#334155" font-family="Arial, sans-serif" font-size="11">No data gaps</text>

  <rect x="16" y="608" width="388" height="180" rx="14" fill="#ffffff" filter="url(#sm)"/>
  <text x="32" y="636" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Coaching Draft</text>
  <text x="32" y="662" fill="#334155" font-family="Arial, sans-serif" font-size="13">- Keep tomorrow ride easy Z2.</text>
  <text x="32" y="684" fill="#334155" font-family="Arial, sans-serif" font-size="13">- Fuel 60-75g carbs/hr over 90 min.</text>
  <text x="32" y="706" fill="#334155" font-family="Arial, sans-serif" font-size="13">- Next key session: 3x12 sweet spot.</text>
  <rect x="32" y="730" width="168" height="40" rx="9" fill="url(#brandm)"/>
  <text x="92" y="755" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Accept</text>
  <rect x="216" y="730" width="172" height="40" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="267" y="755" fill="#334155" font-family="Arial, sans-serif" font-size="13" font-weight="700">Regenerate</text>

  <rect x="16" y="804" width="388" height="96" rx="14" fill="#ffffff" filter="url(#sm)"/>
  <text x="32" y="832" fill="#0f172a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Trace</text>
  <text x="32" y="854" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Req: 8f1c-42ac  Prompt: workout_v12</text>
  <text x="32" y="874" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Docs: 4 reranked  Latency: 2.8s</text>
</svg>
