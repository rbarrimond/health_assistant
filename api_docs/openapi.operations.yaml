openapi: 3.1.0
info:
  title: Health Assistant API (Operations)
  version: "4.0.0"
  description: |
    Operational and administrative API for ingestion, configuration, integrations, and plugin assets.
    Complements the semantic GPT-facing specification with platform control-plane and runtime support endpoints.

    This specification documents the current operations contract. For release history and change chronology, see `docs/CHANGELOG.md`.
servers:
  - url: https://health.azure.barrimond.net
    description: Azure Functions host
paths:
  /api/health:
    get:
      summary: Health check with dependency status
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/physiometrics/update:
    post:
      summary: Update physiometric values
      operationId: updatePhysiometrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhysiometricRequest'
            examples:
              singleMetric:
                summary: Single metric update
                value:
                  athlete_id: rob
                  metric: cycling_vo2max_ml_kg_min
                  value: 52.3
                  effective_date: 2026-01-19
                  source: chatgpt
              bulkUpdate:
                summary: Bulk metric update
                value:
                  athlete_id: rob
                  metrics:
                    weight_kg: 75.2
                    cycling_vo2max_ml_kg_min: 52.3
                  effective_date: 2026-01-19
                  source: chatgpt
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Update accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePhysiometricResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/training-state/current:
    get:
      summary: Get current training state
      operationId: getCurrentTrainingState
      description: Computes on-demand training state projection from recent workouts and current physiometrics. Includes TSS, training load, recovery metrics, and readiness signals.
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Current training state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingStateSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/training-state/history:
    get:
      summary: Get training state time series
      operationId: getTrainingStateHistory
      description: Computes historical training state projections. Each snapshot reflects training load, recovery, and readiness at that point in time.
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
        - name: days
          in: query
          required: false
          description: Days to look back (default 90, max 365)
          schema:
            type: integer
            format: int32
            default: 90
            maximum: 365
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Time-series training state data
          content:
            application/json:
              schema:
                type: object
                properties:
                  athlete_id:
                    type: string
                  days:
                    type: integer
                  snapshots:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrainingStateSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/operations/rollups/weekly/compute:
    post:
      summary: Force previous-week weekly rollup computation
      operationId: forceWeeklyRollups
      description: Computes and persists the previous completed local week rollup for one or more athletes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForceWeeklyRollupsRequest'
            examples:
              singleAthlete:
                summary: Force rollup for one athlete
                value:
                  athlete_id: rob
              multipleAthletes:
                summary: Force rollup for selected athletes
                value:
                  athlete_ids:
                    - rob
                    - sam
              allAthletes:
                summary: Force rollup for all athletes with workouts
                value:
                  all_athletes: true
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Rollups computed successfully (may include skipped athletes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForceWeeklyRollupsResponse'
        '207':
          description: Partial success (one or more athletes failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForceWeeklyRollupsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/logo.svg:
    get:
      summary: Retrieve the Health Assistant logo
      operationId: getLogo
      responses:
        '200':
          description: SVG logo asset
          content:
            image/svg+xml:
              schema:
                type: string
  /api/.well-known/ai-plugin.json:
    get:
      summary: Retrieve the ChatGPT plugin manifest
      operationId: getPluginManifest
      responses:
        '200':
          description: Plugin manifest JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: Name of the plugin
                  description:
                    type: string
                    description: Description of the plugin
                  version:
                    type: string
                    description: Version of the plugin
                  endpoints:
                    type: array
                    description: List of available endpoints
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Endpoint path
                        method:
                          type: string
                          description: HTTP method
                        description:
                          type: string
                          description: Description of the endpoint
                required:
                  - name
                  - description
                  - version
                  - endpoints
  /api/openapi.yaml:
    get:
      summary: Retrieve the OpenAPI specification
      operationId: getOpenApiSpec
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/x-yaml:
              schema:
                type: string
  /api/withings/authorize:
    get:
      summary: Get Withings authorization URL
      operationId: withingsAuthorize
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Authorization URL to open in browser
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithingsAuthorizeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/withings/callback:
    get:
      summary: Handle Withings OAuth callback
      operationId: withingsCallback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success HTML message
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Missing or invalid code/state
          content:
            text/html:
              schema:
                type: string
        '500':
          description: Server error completing OAuth
          content:
            text/html:
              schema:
                type: string
  /api/withings/webhook:
    post:
      summary: Receive Withings webhook notifications
      operationId: withingsWebhook
      security:
        - FunctionKey: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WithingsWebhookPayload'
      responses:
        '200':
          description: Acknowledged (weight notifications only processed)
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Missing required fields
          content:
            text/plain:
              schema:
                type: string
  /api/workouts/{workout_id}/recalculated:
    get:
      summary: Get recalculated workout zones (read-only)
      operationId: getWorkoutRecalculated
      security:
        - FunctionKey: []
      parameters:
        - name: workout_id
          in: path
          required: true
          schema:
            type: string
        - name: ftp_watts
          in: query
          required: false
          schema:
            type: number
            format: float
        - name: lthr_bpm
          in: query
          required: false
          schema:
            type: number
            format: float
      responses:
        '501':
          description: Placeholder response for recalculated zones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecalculatedWorkoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/config/update:
    post:
      summary: Update physiometrics configuration
      operationId: updateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdateRequest'
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Configuration saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/config/history:
    get:
      summary: Get physiometrics configuration change history
      operationId: configHistory
      security:
        - FunctionKey: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: Configuration history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigHistoryResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/process_fit:
    post:
      summary: Ingest a FIT file payload from OneDrive or other sources
      operationId: processFit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessFitRequest'
      security:
        - FunctionKey: []
      responses:
        '201':
          description: Workout ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessFitResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/onedrive/authorize:
    get:
      summary: Generate OneDrive OAuth authorization URL
      operationId: onedriveAuthorize
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Authorization URL payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_url:
                    type: string
                  athlete_id:
                    type: string
                  state:
                    type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /api/onedrive/callback:
    get:
      summary: OneDrive OAuth callback
      operationId: onedriveCallback
      responses:
        '200':
          description: Authorization success
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Missing authorization code
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /api/onedrive/sync:
    post:
      summary: Sync OneDrive folder and ingest FIT files
      operationId: onedriveSync
      security:
        - FunctionKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                athlete_id:
                  type: string
                days:
                  type: integer
                async:
                  type: boolean
      responses:
        '202':
          description: Sync queued (async)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  athlete_id:
                    type: string
                  lookback_days:
                    type: integer
                  folder_path:
                    type: string
                  mode:
                    type: string
                  queued_at_utc:
                    type: string
        '200':
          description: Sync results
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  athlete_id:
                    type: string
                  scanned:
                    type: integer
                  ingested:
                    type: integer
                  skipped:
                    type: integer
                  failed:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'
  /api/onedrive/sync/reset:
    post:
      summary: Reset OneDrive delta cursor state
      operationId: onedriveSyncReset
      security:
        - FunctionKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                athlete_id:
                  type: string
                  description: Athlete identifier for single reset
                all:
                  type: boolean
                  description: When true, reset all athlete delta cursors
      responses:
        '200':
          description: Delta state reset completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  scope:
                    type: string
                    enum: [single, bulk]
                  athlete_id:
                    type: string
                  reset_count:
                    type: integer
                  reset_applied:
                    type: boolean
                  reset_at_utc:
                    type: string
                    format: date-time
        '400':
          description: Missing reset scope (athlete_id or all=true required)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /api/garmin/sync:
    post:
      summary: Sync Garmin Connect activities and ingest FIT files
      operationId: garminSync
      security:
        - FunctionKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                athlete_id:
                  type: string
                  description: Athlete identifier (optional, defaults to DEFAULT_ATHLETE_ID)
                lookback_days:
                  type: integer
                  description: Number of days to look back for activities (default 30)
                async:
                  type: boolean
                  description: Queue sync as background task (default true)
      responses:
        '202':
          description: Sync queued (async mode)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: queued
                  athlete_id:
                    type: string
                  lookback_days:
                    type: integer
                  mode:
                    type: string
                    example: async
                  queued_at_utc:
                    type: string
                    format: date-time
        '200':
          description: Sync completed (sync mode)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  athlete_id:
                    type: string
                  lookback_days:
                    type: integer
                  activities_found:
                    type: integer
                    description: Total activities retrieved from Garmin
                  ingested:
                    type: integer
                    description: Successfully ingested FIT files
                  skipped:
                    type: integer
                    description: Already processed activities
                  failed:
                    type: integer
                    description: Failed ingestions
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        activity_id:
                          type: string
                        activity_name:
                          type: string
                        error:
                          type: string
        '401':
          description: Authentication failed - check GARMIN_EMAIL and GARMIN_PASSWORD
        '500':
          $ref: '#/components/responses/InternalError'
  /api/intervals/sync:
    post:
      summary: Sync Intervals.icu wellness data (HRV, resting HR, sleep, readiness)
      operationId: intervalsSync
      description: |
        Fetch wellness records from Intervals.icu API using HTTP Basic authentication.
        Wellness endpoint consolidates HRV, resting heart rate, sleep duration, and readiness score.
        Requires INTERVALS_API_KEY (stored in Key Vault) and INTERVALS_ATHLETE_ID.
      security:
        - FunctionKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                athlete_id:
                  type: string
                  description: Athlete identifier (optional, defaults to DEFAULT_ATHLETE_ID or INTERVALS_ATHLETE_ID env var)
                lookback_days:
                  type: integer
                  description: Number of days to look back for wellness records (default 30)
            examples:
              basicSync:
                summary: Default sync (30 days)
                value:
                  athlete_id: rob
              customLookback:
                summary: Custom lookback period
                value:
                  athlete_id: rob
                  lookback_days: 60
      responses:
        '200':
          description: Sync completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  athlete_id:
                    type: string
                  lookback_days:
                    type: integer
                  records_fetched:
                    type: integer
                    description: Total wellness records retrieved from Intervals.icu
                  records_processed:
                    type: integer
                    description: Successfully ingested wellness records
                  records_skipped:
                    type: integer
                    description: Duplicate or invalid records
                  date_range:
                    type: object
                    properties:
                      oldest:
                        type: string
                        format: date
                        description: Earliest record date
                      newest:
                        type: string
                        format: date
                        description: Latest record date
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed - check INTERVALS_API_KEY and INTERVALS_ATHLETE_ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Athlete not found in Intervals.icu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Intervals.icu API rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/garmin/physiometrics/sync:
    post:
      summary: Sync Garmin physiometrics data (user summary + training status)
      operationId: garminPhysiometricsSync
      description: |
        Fetch physiometrics data from Garmin Connect using user summary and training status endpoints.
        Retrieves daily metrics including VO2Max, training load, training effect (aerobic/anaerobic),
        training stress score, ATP probability, recovery time, and lactate threshold heart rate.
        Requires Garmin Connect credentials (EMAIL and PASSWORD stored in Key Vault).
      security:
        - FunctionKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                athlete_id:
                  type: string
                  description: Athlete identifier (optional, defaults to DEFAULT_ATHLETE_ID env var)
                lookback_days:
                  type: integer
                  description: Number of days to look back for physiometrics data (default 7)
            examples:
              basicSync:
                summary: Default sync (7 days)
                value:
                  athlete_id: rob
              customLookback:
                summary: Custom lookback period
                value:
                  athlete_id: rob
                  lookback_days: 14
      responses:
        '200':
          description: Sync completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  athlete_id:
                    type: string
                  lookback_days:
                    type: integer
                  records_processed:
                    type: integer
                    description: Successfully ingested physiometrics records (days with valid data)
                  date_range:
                    type: object
                    properties:
                      start:
                        type: string
                        format: date
                        description: Start date of sync window
                      end:
                        type: string
                        format: date
                        description: End date of sync window (inclusive)
                required:
                  - status
                  - athlete_id
                  - lookback_days
                  - records_processed
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed - check Garmin Connect credentials (EMAIL/PASSWORD in Key Vault)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    AthleteId:
      name: athlete_id
      in: query
      required: true
      description: Athlete identifier
      schema:
        type: string
    AthleteIdOptional:
      name: athlete_id
      in: query
      required: false
      description: Athlete identifier (optional; falls back to DEFAULT_ATHLETE_ID)
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
          description: Overall health status
        timestamp:
          type: string
          format: date-time
          description: ISO8601 timestamp of the health check
        storage:
          type: string
          enum: [ok, degraded]
          description: Table storage connectivity status
      required:
        - status
        - timestamp
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: athlete_id required
    ForceWeeklyRollupsRequest:
      type: object
      properties:
        athlete_id:
          type: string
          description: Force rollup for a single athlete.
        athlete_ids:
          type: array
          description: Force rollups for a list of athletes.
          items:
            type: string
        weeks:
          type: integer
          default: 1
          minimum: 1
          maximum: 52
          description: Number of completed prior local weeks to compute per athlete.
        all_athletes:
          type: boolean
          default: false
          description: When true, compute rollups for all athletes detected from workouts.
    ForceWeeklyRollupsResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, partial, failed, skipped]
        message:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyRollupAthleteResult'
      required:
        - status
        - message
        - results
    WeeklyRollupAthleteResult:
      type: object
      properties:
        athlete_id:
          type: string
        status:
          type: string
          enum: [success, partial, failed, skipped]
        message:
          type: string
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyRollupWeekResult'
        summary:
          type: object
          properties:
            requested_weeks:
              type: integer
            succeeded:
              type: integer
            skipped:
              type: integer
            failed:
              type: integer
          required:
            - requested_weeks
            - succeeded
            - skipped
            - failed
      required:
        - athlete_id
        - status
        - message
        - weeks
        - summary
    WeeklyRollupWeekResult:
      type: object
      properties:
        weeks_ago:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [success, failed, skipped]
        message:
          type: string
        rollup:
          type: object
          description: Present when week status is success.
          additionalProperties: true
        error_type:
          type: string
        error:
          type: string
      required:
        - weeks_ago
        - status
        - message
    AgentContext:
      type: object
      properties:
        athlete_id:
          type: string
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/Preference'
        active_observations:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        instruction_addendum:
          type:
            - string
            - 'null'
        retrieved_at:
          type: string
          format: date-time
      required:
        - athlete_id
        - preferences
        - active_observations
    AgentPreferences:
      description: Legacy single-record preferences schema (deprecated)
      type: object
      properties:
        current_goal:
          type: string
          description: Current training goal
        training_phase:
          type: string
          description: Training phase (base, build, peak, recovery)
        preferred_sports:
          type: array
          items:
            type: string
