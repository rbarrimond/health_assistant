    PhysiometricSnapshot:
      type: object
      description: Daily physiometrics snapshot aggregating body state from all sources (Withings, Intervals, Garmin). Version 3.0.0 uses exclusive ownership for all fields.
      properties:
        athlete_id:
          type: string
          description: Athlete identifier (partition key)
        effective_date:
          type: string
          format: date
          description: Effective date (YYYY-MM-DD) in athlete local timezone
        # Body composition (Withings exclusive)
        weight_kg:
          type: number
          description: Body weight in kg
          minimum: 0
        fat_mass_kg:
          type: number
          description: Fat mass in kg
          minimum: 0
        muscle_mass_kg:
          type: number
          description: Muscle mass in kg
          minimum: 0
        bone_mass_kg:
          type: number
          description: Bone mass in kg
          minimum: 0
        body_fat_pct:
          type: number
          description: Body fat percentage
          minimum: 0
          maximum: 100
        # Recovery metrics (Intervals exclusive)
        hrv_ln_rmssd:
          type: number
          description: HRV (natural log of RMSSD) for modeling
        sleep_duration_sec:
          type: number
          description: Sleep duration in seconds
          minimum: 0
        resting_hr_bpm:
          type: number
          description: Resting heart rate (Intervals exclusive; Garmin ignored)
          minimum: 0
        # Activity (Intervals exclusive)
        steps:
          type: integer
          description: Daily step count (Intervals exclusive; Garmin ignored)
          minimum: 0
        # Nutrition (Intervals exclusive)
        calories_kcal:
          type: number
          description: Daily calorie intake in kcal
          minimum: 0
        carbs_g:
          type: number
          description: Carbohydrate intake in grams
          minimum: 0
        protein_g:
          type: number
          description: Protein intake in grams
          minimum: 0
        fat_g:
          type: number
          description: Fat intake in grams
          minimum: 0
        # Performance baselines (Garmin exclusive)
        ftp_watts:
          type: number
          description: Functional threshold power in watts
          minimum: 0
        cycling_vo2max_ml_kg_min:
          type: number
          description: Estimated cycling VO2Max in ml/kg/min
          minimum: 0
        hr_lthr_bpm:
          type: number
          description: Lactate threshold heart rate in beats/minute
          minimum: 0
        hr_max_bpm:
          type: number
          description: Maximum heart rate in beats/minute
          minimum: 0
        # Training state (Garmin exclusive)
        training_load:
          type: number
          description: Garmin cumulative training load
          minimum: 0
        recovery_time_minutes:
          type: integer
          description: Garmin estimated recovery time in minutes
          minimum: 0
        readiness_score:
          type: number
          description: Garmin readiness score (0-100)
          minimum: 0
          maximum: 100
        # Extended training metrics (Garmin exclusive)
        training_effect_aerobic:
          type: number
          description: Garmin aerobic training effect (0-5)
          minimum: 0
          maximum: 5
        training_effect_anaerobic:
          type: number
          description: Garmin anaerobic training effect (0-5)
          minimum: 0
          maximum: 5
        training_stress_score:
          type: number
          description: Garmin training stress score
          minimum: 0
        training_stress_balance:
          type: number
          description: Garmin training stress balance
        atp_probability:
          type: number
          description: Garmin ATP/energy availability percentage
          minimum: 0
          maximum: 100
        # Provenance and versioning
        data_sources:
          type: string
          description: "CSV of sources: withings,garmin,intervals"
          default: ""
        canonical_version:
          type: string
          description: Schema version (3.0.0 = simplified MVP)
          default: "3.0.0"
        last_updated_utc:
          type: string
          format: date-time
          description: When this snapshot was canonicalized
      required:
        - athlete_id
        - effective_date
    PhysiometricHistory:
      type: object
      properties:
        athlete_id:
          type: string
        query_window:
          type: object
          properties:
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
            days:
              type: integer
        count:
          type: integer
        data_points:
          type: array
          items:
