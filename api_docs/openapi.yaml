    TrainingStateSnapshot:
      type: object
      description: Daily training state snapshot computed from workouts and physiometrics. All metrics are derived and idempotent; safe to recompute any time.
      properties:
        athlete_id:
          type: string
          description: Athlete identifier (partition key)
        effective_date:
          type: string
          format: date
          description: Effective date (YYYY-MM-DD) in athlete local timezone
        cts_rolling_7d:
          type: number
          description: Chronic training stress (7 days)
          minimum: 0
        cts_rolling_28d:
          type: number
          description: Chronic training stress (28 days)
          minimum: 0
        ats_rolling:
          type: number
          description: Acute training stress (7 days)
          minimum: 0
        fatigue_index:
          type: number
          description: Fatigue index (ATS / CTS; higher = more fatigued)
        readiness_score:
          type: [number, 'null']
          description: Composite readiness from HRV and fatigue load (0-100); null when data absent
          minimum: 0
          maximum: 100
        garmin_readiness_score:
          type: [number, 'null']
          description: Garmin native readiness score (passthrough)
          minimum: 0
          maximum: 100
        garmin_training_status:
          type: [string, 'null']
          description: Garmin training status label (e.g., PRODUCTIVE, MAINTAINING, OVERREACHING, RECOVERY)
        garmin_training_load:
          type: [number, 'null']
          description: Garmin 7-day cumulative training load (distinct from our CTS)
          minimum: 0
        garmin_recovery_time_hours:
          type: [number, 'null']
          description: Garmin estimated recovery time in hours (converted from minutes)
          minimum: 0
        garmin_load_focus_low_aerobic_pct:
          type: [number, 'null']
          description: Percentage of Load Focus in low aerobic zone (0-100)
          minimum: 0
          maximum: 100
        garmin_load_focus_high_aerobic_pct:
          type: [number, 'null']
          description: Percentage of Load Focus in high aerobic zone (0-100)
          minimum: 0
          maximum: 100
        garmin_load_focus_anaerobic_pct:
          type: [number, 'null']
          description: Percentage of Load Focus in anaerobic zone (0-100)
          minimum: 0
          maximum: 100
        mood:
          type: integer
          description: User-reported mood (1-5)
          minimum: 1
          maximum: 5
        soreness:
          type: integer
          description: User-reported soreness (1-5)
          minimum: 1
          maximum: 5
        pred_recovery_days:
          type: integer
          description: Predicted days to full recovery
          minimum: 0
        data_sources:
          type: string
          description: "CSV of sources: workouts,physiometrics,garmin"
          default: ""
        canonical_version:
          type: string
          description: Schema version of this snapshot
          default: "3.0.0"
        last_updated_utc:
          type: string
          format: date-time
          description: When snapshot was computed
      required:
        - athlete_id
        - effective_date
