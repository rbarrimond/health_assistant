openapi: 3.1.0
info:
  title: Health Assistant API (Semantic/GPT)
  version: "8.0.0"
  description: |
    GPT-facing semantic API for athlete memory, planning context, workouts, physiometrics, and training-state signals.
    Use this spec for conversational decision support; use openapi.operations.yaml for operational and system endpoints.

    Response compression contract:
    - Clients may request gzip by sending `Accept-Encoding: gzip`.
    - Responses may include `Content-Encoding: gzip` and `Vary: Accept-Encoding`.
    - `deflate` and `br` are not part of the current response encoding contract.
servers:
  - url: https://health.azure.barrimond.net
    description: Azure Functions host
paths:
  /api/health:
    get:
      summary: Health check with dependency status
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/agent/context:
    get:
      summary: Get agent memory context (preferences + active observations)
      operationId: getAgentContext
      description: Returns the assistant working memory used for conversational grounding. Call this at conversation start to load active preferences and observations before planning or recommendation endpoints.
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Agent context with preferences and observations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentContext'
              examples:
                default:
                  $ref: '#/components/examples/AgentContextExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/agent/preferences:
    get:
      summary: List agent preferences
      operationId: getAgentPreferences
      description: Returns ordered preference items for the athlete. Use `status=active` for current constraints and goals before recommendation generation.
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
        - name: status
          in: query
          required: false
          description: Filter by status
          schema:
            type: string
            enum: [active, resolved, archived, all]
            default: active
        - name: limit
          in: query
          required: false
          description: Maximum number of preferences
          schema:
            type: integer
            default: 20
            maximum: 100
      security:
        - FunctionKey: []
      responses:
        '200':
          description: List of preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPreferencesResponse'
              examples:
                default:
                  $ref: '#/components/examples/AgentPreferencesListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create new preference
      operationId: createAgentPreference
      description: Creates a structured preference item (category/summary/details/priority/status). This endpoint is item-based create, not legacy bulk-update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreferenceRequest'
            examples:
              default:
                $ref: '#/components/examples/CreatePreferenceRequestExample'
      security:
        - FunctionKey: []
      responses:
        '201':
          description: Preference created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceCreateResponse'
              examples:
                default:
                  $ref: '#/components/examples/PreferenceCreateResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/agent/preferences/{preference_id}:
    patch:
      summary: Update a preference
      operationId: updateAgentPreference
      description: Updates mutable fields for one preference item by ID. Typical usage is lifecycle transitions such as `active -> resolved`.
      parameters:
        - name: preference_id
          in: path
          required: true
          description: Preference UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                athlete_id:
                  type: string
                category:
                  type: string
                summary:
                  type: string
                details:
                  type: string
                priority:
                  type: string
                  enum: [low, normal, high]
                status:
                  type: string
                  enum: [active, resolved, archived]
            examples:
              resolvePreference:
                $ref: '#/components/examples/UpdatePreferenceRequestExample'
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Preference updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceUpdateResponse'
              examples:
                default:
                  $ref: '#/components/examples/PreferenceUpdateResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/agent/observations:
    get:
      summary: List training observations
      operationId: listAgentObservations
      description: Returns observation items that capture constraints, flags, and patterns. Use active observations to adjust recommendations.
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
        - name: status
          in: query
          required: false
          description: Filter by status
          schema:
            type: string
            enum: [active, resolved, archived, all]
            default: active
        - name: limit
          in: query
          required: false
          description: Maximum number of observations
          schema:
            type: integer
            default: 20
            maximum: 100
      security:
        - FunctionKey: []
      responses:
        '200':
          description: List of observations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationsList'
              examples:
                default:
                  $ref: '#/components/examples/ObservationsListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Add new training observation
      operationId: addAgentObservation
      description: Creates an observation item with optional detail, workout references, and TTL-style expiration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateObservationRequest'
            examples:
              default:
                $ref: '#/components/examples/CreateObservationRequestExample'
      security:
        - FunctionKey: []
      responses:
        '201':
          description: Observation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationCreateResponse'
              examples:
                default:
                  $ref: '#/components/examples/ObservationCreateResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/agent/observations/{observation_id}:
    patch:
      summary: Update observation status
      operationId: updateAgentObservation
      description: Updates one observation by ID. Most common usage is status transitions (`active`, `resolved`, `archived`).
      parameters:
        - name: observation_id
          in: path
          required: true
          description: Observation UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                athlete_id:
                  type: string
                status:
                  type: string
                  enum: [active, resolved, archived]
            examples:
              resolveObservation:
                $ref: '#/components/examples/UpdateObservationStatusRequestExample'
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Observation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationStatusResponse'
              examples:
                default:
                  $ref: '#/components/examples/ObservationStatusResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/planning/context:
    get:
      summary: Get planning context for training decisions
      description: Returns planning-ready context for short-horizon coaching decisions. Treat this as the primary endpoint for “what should I do next?” reasoning. Zone totals are stored in seconds but surfaced as minutes in summary fields.
      operationId: planningContext
      security:
        - FunctionKey: []
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 45
            maximum: 365
      responses:
        '200':
          description: Planning context payload with WorkoutProjection objects in recent_workouts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningContext'
              examples:
                default:
                  $ref: '#/components/examples/PlanningContextExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workouts:
    get:
      summary: Query workouts with filters
      description: Lists workouts for an athlete/date window as compact projections for sorting and filtering. Use this for retrieval and triage; call workout detail endpoints only when deeper metrics are needed.
      operationId: listWorkouts
      security:
        - FunctionKey: []
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: sport
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of WorkoutProjection objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutsList'
              examples:
                default:
                  $ref: '#/components/examples/WorkoutsListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workouts/{workout_id}:
    get:
      summary: Get detailed workout data
      operationId: getWorkout
      description: Returns a deep workout record for one session, including identity fields and nested metric families for analysis. Use this endpoint only when projection data is insufficient for the decision.
      security:
        - FunctionKey: []
      parameters:
        - name: workout_id
          in: path
          required: true
          schema:
            type: string
        - name: athlete_id
          in: query
          required: true
          description: Athlete identifier
          schema:
            type: string
        - name: laps
          in: query
          required: false
          description: Include lap summaries if available
          schema:
            type: boolean
            default: false
        - name: developer_fields
          in: query
          required: false
          description: Include FIT developer fields summary (Garmin-specific per-lap metrics). Adds `developer_fields_summary` to the response when present.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Workout detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutDetail'
              examples:
                default:
                  $ref: '#/components/examples/WorkoutDetailExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Workout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workouts/{workout_id}/laps/{lap_index}:
    get:
      summary: Get lap summary detail
      operationId: getWorkoutLap
      security:
        - FunctionKey: []
      parameters:
        - name: workout_id
          in: path
          required: true
          schema:
            type: string
        - name: lap_index
          in: path
          required: true
          schema:
            type: integer
        - name: athlete_id
          in: query
          required: true
          description: Athlete identifier
          schema:
            type: string
      responses:
        '200':
          description: Lap detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutLapDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/rollups/weekly:
    get:
      summary: Get weekly rollup data
      operationId: weeklyRollups
      security:
        - FunctionKey: []
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
        - name: weeks
          in: query
          required: false
          schema:
            type: integer
            default: 16
            maximum: 52
      responses:
        '200':
          description: Weekly rollups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyRollups'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/analysis/zones:
    get:
      summary: Get time-in-zone distribution
      operationId: zoneDistribution
      security:
        - FunctionKey: []
      parameters:
        - name: athlete_id
          in: query
          required: true
          description: Athlete identifier
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
            maximum: 365
      responses:
        '200':
          description: Zone distribution data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneDistribution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/analysis/efficiency:
    get:
      summary: Get aerobic efficiency and decoupling trends
      operationId: efficiencyTrends
      security:
        - FunctionKey: []
      parameters:
        - name: athlete_id
          in: query
          required: true
          description: Athlete identifier
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 90
            maximum: 365
      responses:
        '200':
          description: Efficiency trend data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EfficiencyTrends'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/physiometrics/current:
    get:
      summary: Get current physiometric values
      operationId: getCurrentPhysiometrics
      description: Returns the latest canonical physiometrics snapshot across heart rate, power, body composition, recovery, and readiness domains.
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Current snapshot of metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysiometricSnapshot'
              examples:
                default:
                  $ref: '#/components/examples/PhysiometricsCurrentExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/physiometrics/history:
    get:
      summary: Get physiometric time series
      operationId: getPhysiometricsHistory
      description: Returns physiometrics trend points for the requested lookback window and optional metric filter.
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
        - name: days
          in: query
          required: false
          description: Days to look back (default 90, max 365)
          schema:
            type: integer
            format: int32
            default: 90
            maximum: 365
        - name: metrics
          in: query
          required: false
          description: Comma-separated list of metric identifiers
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Time-series data for requested metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysiometricHistory'
              examples:
                default:
                  $ref: '#/components/examples/PhysiometricsHistoryExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/training-state/current:
    get:
      summary: Get current training state
      operationId: getCurrentTrainingState
      description: Returns the athlete’s latest training-state snapshot, including current load, recovery, and readiness indicators.
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Current training state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingStateSnapshot'
              examples:
                default:
                  $ref: '#/components/examples/TrainingStateCurrentExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/training-state/history:
    get:
      summary: Get training state time series
      operationId: getTrainingStateHistory
      description: Returns a time series of training-state snapshots across the requested period for trend and trajectory analysis.
      parameters:
        - name: athlete_id
          in: query
          required: false
          description: Athlete identifier (defaults to 'rob')
          schema:
            type: string
            default: rob
        - name: days
          in: query
          required: false
          description: Days to look back when since/until are not provided (default 45, max 90)
          schema:
            type: integer
            format: int32
            default: 45
            maximum: 90
        - name: since
          in: query
          required: false
          description: Inclusive start date (YYYY-MM-DD). Overrides the derived start date when provided.
          schema:
            type: string
            format: date
        - name: until
          in: query
          required: false
          description: Inclusive end date (YYYY-MM-DD). Defaults to today when omitted.
          schema:
            type: string
            format: date
      security:
        - FunctionKey: []
      responses:
        '200':
          description: Time-series training state data
          content:
            application/json:
              schema:
                type: object
                properties:
                  athlete_id:
                    type: string
                  query_window:
                    type: object
                    properties:
                      start_date:
                        type: string
                        format: date
                      end_date:
                        type: string
                        format: date
                      days:
                        type: integer
                  count:
                    type: integer
                  data_points:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrainingStateSnapshot'
                  computed_at_utc:
                    type: string
                    format: date-time
              examples:
                default:
                  $ref: '#/components/examples/TrainingStateHistoryExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    AthleteId:
      name: athlete_id
      in: query
      required: true
      description: Athlete identifier
      schema:
        type: string
    AthleteIdOptional:
      name: athlete_id
      in: query
      required: false
      description: Athlete identifier (optional; falls back to DEFAULT_ATHLETE_ID)
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidInput:
              $ref: '#/components/examples/BadRequestExample'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unexpectedFailure:
              $ref: '#/components/examples/InternalErrorExample'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingResource:
              $ref: '#/components/examples/NotFoundExample'
  examples:
    BadRequestExample:
      summary: Invalid request payload or query
      value:
        error: athlete_id required
    InternalErrorExample:
      summary: Unexpected server-side failure
      value:
        error: Internal server error
    NotFoundExample:
      summary: Requested resource does not exist
      value:
        error: Preference not found
    AgentContextExample:
      summary: Context payload for conversation grounding
      value:
        athlete_id: rob
        preferences:
          - preference_id: c9c8812c-9b11-4cc2-a6d2-6f4f1ba2e0c8
            category: goal
            summary: Build aerobic base for spring races
            details: Focus on Z2 consistency and fatigue control
            priority: high
            status: active
            created_at: '2026-03-01T08:00:00+00:00'
        active_observations:
          - observation_id: 4e36e2f2-4ca6-4eb5-8cb2-2cfa9d689f31
            category: fatigue
            summary: Poor sleep in last 3 nights
            priority: normal
            status: active
            created_at: '2026-03-24T06:00:00+00:00'
        instruction_addendum: User goal is aerobic base; account for active fatigue observation.
        retrieved_at: '2026-03-25T09:30:00+00:00'
    AgentPreferencesListExample:
      summary: Active preference list response
      value:
        athlete_id: rob
        count: 2
        preferences:
          - preference_id: c9c8812c-9b11-4cc2-a6d2-6f4f1ba2e0c8
            category: goal
            summary: Build aerobic base for spring races
            priority: high
            status: active
            created_at: '2026-03-01T08:00:00+00:00'
          - preference_id: 16af8f3f-80ab-4ad8-bb34-cc0ffcf2a7c5
            category: schedule
            summary: Hard sessions only Tue/Thu
            priority: normal
            status: active
            created_at: '2026-03-02T08:00:00+00:00'
    CreatePreferenceRequestExample:
      summary: Request to create a goal preference
      value:
        athlete_id: rob
        category: goal
        summary: Build aerobic base for spring races
        details: Prioritize consistent Z2 volume over intensity this month
        priority: high
        status: active
    PreferenceCreateResponseExample:
      summary: Preference creation response
      value:
        preference_id: c9c8812c-9b11-4cc2-a6d2-6f4f1ba2e0c8
        preference:
          preference_id: c9c8812c-9b11-4cc2-a6d2-6f4f1ba2e0c8
          athlete_id: rob
          category: goal
          summary: Build aerobic base for spring races
          details: Prioritize consistent Z2 volume over intensity this month
          priority: high
          status: active
          created_at: '2026-03-25T09:32:00+00:00'
          updated_at: '2026-03-25T09:32:00+00:00'
    UpdatePreferenceRequestExample:
      summary: Resolve a completed preference
      value:
        athlete_id: rob
        status: resolved
    PreferenceUpdateResponseExample:
      summary: Preference update response
      value:
        preference_id: c9c8812c-9b11-4cc2-a6d2-6f4f1ba2e0c8
        preference:
          preference_id: c9c8812c-9b11-4cc2-a6d2-6f4f1ba2e0c8
          athlete_id: rob
          category: goal
          summary: Build aerobic base for spring races
          priority: high
          status: resolved
          created_at: '2026-03-01T08:00:00+00:00'
          updated_at: '2026-03-25T09:40:00+00:00'
    ObservationsListExample:
      summary: Observation list response
      value:
        athlete_id: rob
        count: 1
        observations:
          - observation_id: 4e36e2f2-4ca6-4eb5-8cb2-2cfa9d689f31
            category: fatigue
            summary: Poor sleep in last 3 nights
            details: HRV below baseline and subjective fatigue elevated
            referenced_workout_ids: []
            priority: normal
            status: active
            created_at: '2026-03-24T06:00:00+00:00'
    CreateObservationRequestExample:
      summary: Request to create an observation
      value:
        athlete_id: rob
        category: fatigue
        summary: Poor sleep in last 3 nights
        details: HRV below baseline and subjective fatigue elevated
        workout_ids: []
        priority: normal
        expires_days: 7
    ObservationCreateResponseExample:
