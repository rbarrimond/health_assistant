            updated_at_utc:
              type: string
    ConfigHistoryResponse:
      type: object
      properties:
        status:
          type: string
        count:
          type: integer
        history:
          type: array
          items:
            type: object
            properties:
              updated_at_utc:
                type: string
              heart_rate:
                type: object
                additionalProperties: true
              power:
                type: object
                additionalProperties: true
    PlanningContext:
      type: object
      description: Aggregated planning contract for coaching decisions, combining recent workouts, rollups, query window metadata, and notable flags.
      properties:
        athlete_id:
          type: string
        query_window:
          type: object
        recent_workouts:
          type: array
          description: List of WorkoutProjection objects (lightweight summaries for efficient batch queries)
          items:
            $ref: '#/components/schemas/WorkoutProjection'
        weekly_rollups:
          type: array
          items:
            type: object
        summary:
          type: object
        notable_flags:
          type: array
          items:
            type: string
      additionalProperties: true
    WorkoutsList:
      type: object
      properties:
        athlete_id:
          type: string
        count:
          type: integer
        workouts:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutProjection'
    WorkoutProjection:
      type: object
      description: Compact per-workout projection for list and planning views, covering session identity, key summary fields, data-availability flags, and headline performance values.
      required:
        - workout_id
        - athlete_id
        - sport
        - start_time_utc
        - duration_sec
        - has_power
        - has_hr
        - has_gps
      properties:
        workout_id:
          type: string
          description: Unique workout identifier
        athlete_id:
          type: string
          description: Athlete identifier
        sport:
          type: string
          description: Primary sport/activity type
        sub_sport:
          type: [string, "null"]
          description: Sub-sport classification
        workout_name:
          type: [string, "null"]
          description: User-provided workout name
        device_name:
          type: [string, "null"]
          description: Device name (e.g., 'Robert's Apple Watch', 'Garmin Edge 1050')
        device_manufacturer:
          type: [string, "null"]
          description: Device manufacturer (Apple, Garmin, Wahoo, etc.)
        start_time_utc:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp
        local_tz_offset:
          type: [string, "null"]
          description: Local wall-clock UTC offset (e.g., 'UTC-05:00')
        timezone:
          type: [string, "null"]
          description: IANA timezone name (e.g., 'America/New_York')
        duration_sec:
          type: number
          description: Total elapsed time in seconds
        moving_time_sec:
          type: [number, "null"]
          description: Active moving time in seconds
        distance_m:
          type: [number, "null"]
          description: GPS distance in meters
        elevation_gain_m:
          type: [number, "null"]
          description: Elevation gain in meters
        elevation_loss_m:
          type: [number, "null"]
          description: Elevation loss in meters
        calories_kcal:
          type: [number, "null"]
          description: Total energy expenditure in kilocalories
        has_power:
          type: boolean
          description: Workout contains power meter data
        has_hr:
          type: boolean
          description: Workout contains heart rate data
        has_gps:
          type: boolean
          description: Workout contains GPS data
        hr_avg_bpm:
          type: [number, "null"]
          description: Average heart rate (bpm) — populated if has_hr=true
        hr_max_bpm:
          type: [number, "null"]
          description: Max heart rate (bpm) — populated if has_hr=true
        pwr_avg_watts:
          type: [number, "null"]
          description: Average power (watts) — populated if has_power=true
        pwr_max_watts:
          type: [number, "null"]
          description: Max power (watts) — populated if has_power=true
        pwr_normalized_watts:
          type: [number, "null"]
          description: Normalized power (watts) — populated if has_power=true
        cad_avg_rpm:
          type: [number, "null"]
          description: Average cadence (rpm)
        cad_max_rpm:
          type: [number, "null"]
          description: Max cadence (rpm)
        is_indoor:
          type: boolean
          description: Workout was performed indoors
        race_flag:
          type: boolean
          description: Marked as race/competitive event
        commute_flag:
          type: boolean
          description: Marked as commute workout
        ingestion_version:
          type: [string, "null"]
          description: Ingestion pipeline version
        ingestion_timestamp_utc:
          type: [string, "null"]
          format: date-time
          description: ISO 8601 UTC timestamp of ingestion
    WorkoutSummary:
      type: object
      deprecated: true
      description: Legacy full workout summary schema kept for compatibility with older consumers.
      properties:
        workout_id:
          type: string
        athlete_id:
          type: string
        sport:
          type: string
        sub_sport:
          type: string
        workout_name:
          type: string
        is_indoor:
          type: boolean
        device_name:
          type: string
        start_time_utc:
          type: string
          format: date-time
        local_tz_offset:
          type: string
          description: Local wall-clock UTC offset for client display formatting (for example `UTC-05:00`).
        timezone:
          type: string
          description: IANA timezone name when available (for example `America/New_York`), otherwise falls back to UTC offset.
        duration_sec:
          type: number
        moving_time_sec:
          type: number
        distance_m:
          type: number
        elevation_gain_m:
          type: number
        calories_kcal:
          type: number
        hr_avg_bpm:
          type: number
        hr_max_bpm:
          type: number
        hr_z1_sec:
          type: number
        hr_z2_sec:
          type: number
        hr_z3_sec:
          type: number
        hr_z4_sec:
          type: number
        hr_z5_sec:
          type: number
        hr_zone_basis:
          type: string
        hr_zone_reference_bpm:
          type: number
        pwr_avg_watts:
          type: number
        pwr_max_watts:
          type: number
        pwr_normalized_watts:
          type: number
        pwr_variability_index:
          type: number
        pwr_z1_sec:
          type: number
        pwr_z2_sec:
          type: number
        pwr_z3_sec:
          type: number
        pwr_z4_sec:
          type: number
        pwr_z5_sec:
          type: number
        pwr_z6_sec:
          type: number
        pwr_z7_sec:
          type: number
        low_aerobic_sec:
          type: number
        intensity_sec:
          type: number
        ftp_watts:
          type: number
        intensity_factor:
          type: number
        tss:
          type: number
        decoupling_pct:
          type: number
        hr_drift_bpm:
          type: number
        ef_first_half:
          type: number
        ef_second_half:
          type: number
        ef_overall:
          type: number
        source_system:
          type: string
      additionalProperties: true
    WorkoutDetail:
      type: object
      description: Single-workout detail contract with stable identity fields and a rich nested metrics payload for session-level analysis.
      required:
        - workout_id
        - athlete_id
        - metrics
      properties:
        workout_id:
          type: string
          description: Unique workout identifier
        athlete_id:
          type: string
          description: Athlete identifier
        source_system:
          type: [string, "null"]
          description: Source provider for workout ingestion
        metrics:
          $ref: '#/components/schemas/WorkoutMetricsModel'
        laps_count:
          type: [integer, "null"]
          minimum: 0
          description: Number of laps included when `laps=true`
        laps:
          type: [array, "null"]
          description: Lap summaries when `laps=true`
          items:
            $ref: '#/components/schemas/LapSummary'
        lap_errors:
          type: [object, "null"]
          description: Lap loading/parsing errors when lap payload cannot be fully resolved
          additionalProperties:
            type: string
        developer_fields_summary:
          type: [object, "null"]
          description: Optional summary of FIT developer fields when `developer_fields=true`
          additionalProperties: true
        developer_fields_error:
          type: [string, "null"]
          description: Error message if developer field extraction failed

    WorkoutMetricsModel:
      type: object
      description: Nested workout metrics grouped by semantic families such as session, zones, load, variability, durability, and artifacts.
      required:
        - session
        - samples
        - distance
      properties:
        physiometrics_snapshot_timestamp:
          type: [string, "null"]
          format: date-time
        session:
          type: object
          description: Session summary with flattened identity/session values plus raw `enrichment` passthrough from the canonical `metadata.json` blob; timezone fields remain normalized at the top of `session`.
          additionalProperties: true
        samples:
          type: object
          additionalProperties: true
        distance:
          type: object
          additionalProperties: true
        zones_hr:
          type: [object, "null"]
          additionalProperties: true
        zones_power:
          type: [object, "null"]
          additionalProperties: true
        hr_resting_bpm:
          type: [number, "null"]
        training_load:
          type: [object, "null"]
          additionalProperties: true
        power_duration:
          type: [object, "null"]
          additionalProperties: true
        envelope:
          type: [object, "null"]
          additionalProperties: true
        variability:
          type: [object, "null"]
          additionalProperties: true
        durability:
          type: [object, "null"]
          additionalProperties: true
        artifacts:
          type: [object, "null"]
          additionalProperties: true
    LapSummary:
      type: object
      additionalProperties: false
      required:
        - lap_index
      properties:
        lap_index:
          type: integer
          minimum: 0
          description: Zero-based lap index
        message_index:
          type: [integer, "null"]
          minimum: 0
          description: FIT message_index when present
        start_time:
          type: [string, "null"]
          format: date-time
          description: Lap start timestamp in UTC
        end_time:
          type: [string, "null"]
          format: date-time
          description: Lap end timestamp in UTC
        total_elapsed_time:
          type: [number, "null"]
          minimum: 0
          description: Total elapsed time in seconds
        total_timer_time:
          type: [number, "null"]
          minimum: 0
          description: Total active timer time in seconds
        total_distance:
          type: [number, "null"]
          minimum: 0
          description: Total distance in meters
        total_calories:
          type: [number, "null"]
          minimum: 0
          description: Total calories in kilocalories
        avg_heart_rate:
          type: [number, "null"]
          minimum: 0
          description: Average heart rate in bpm
        max_heart_rate:
          type: [number, "null"]
          minimum: 0
          description: Maximum heart rate in bpm
        avg_power:
          type: [number, "null"]
          minimum: 0
          description: Average power in watts
        max_power:
          type: [number, "null"]
          minimum: 0
          description: Maximum power in watts
        avg_cadence:
          type: [number, "null"]
          minimum: 0
          description: Average cadence in rpm
        max_cadence:
          type: [number, "null"]
          minimum: 0
          description: Maximum cadence in rpm
        avg_speed:
          type: [number, "null"]
          minimum: 0
          description: Average speed in m/s
        max_speed:
          type: [number, "null"]
          minimum: 0
          description: Maximum speed in m/s
        intensity:
          type: [string, "null"]
          description: FIT intensity label
        lap_trigger:
          type: [string, "null"]
          description: FIT lap trigger type
        sport:
          type: [string, "null"]
          description: Lap sport
        sub_sport:
          type: [string, "null"]
          description: Lap sub-sport
        extra_fields:
          type: [object, "null"]
          description: Additional lap fields not promoted into top-level summary attributes
          additionalProperties: true
    WorkoutLapDetail:
      type: object
      additionalProperties: false
      required:
        - workout_id
        - athlete_id
        - lap
      properties:
        workout_id:
          type: string
          description: Unique workout identifier
        athlete_id:
          type: string
          description: Athlete identifier
        lap:
          $ref: '#/components/schemas/LapSummary'
    WeeklyRollups:
      type: object
      additionalProperties: false
      required:
        - athlete_id
        - weeks
        - count
        - status
        - message
        - results
        - rollups
      properties:
        athlete_id:
          type: string
        weeks:
          type: integer
        count:
          type: integer
        status:
          type: string
          enum: [success, partial, skipped]
        message:
          type: string
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - weeks_ago
              - status
              - message
            properties:
              weeks_ago:
                type: integer
                minimum: 1
              status:
                type: string
                enum: [success, skipped]
              message:
                type: string
              week_start_utc:
                type: string
                format: date-time
              week_end_utc:
                type: string
                format: date-time
        rollups:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - week_start_utc
              - week_end_utc
              - workouts_count
              - total_duration_min
              - total_hr_z2_min
              - total_pwr_z2_min
              - total_low_aerobic_min
              - total_intensity_min
              - last_updated_at_utc
            properties:
              week_start_utc:
                type: string
                format: date-time
              week_end_utc:
                type: string
                format: date-time
              workouts_count:
                type: integer
              total_duration_min:
                type: number
              total_distance_km:
                type: number
              total_elev_m:
                type: number
              total_hr_z2_min:
                type: number
              total_pwr_z2_min:
                type: number
              total_low_aerobic_min:
                type: number
              total_intensity_min:
                type: number
              avg_decoupling_pct:
                type: number
              hard_days_count:
                type: integer
              long_rides_count:
                type: integer
              athlete_home_timezone:
                type: string
              week_start_local:
                type: string
                format: date-time
              week_end_local:
                type: string
                format: date-time
              last_updated_at_utc:
                type: string
                format: date-time
    ZoneDistribution:
      type: object
      description: Zone-distribution contract with absolute minutes and percentages by zone across the selected time window.
      properties:
        athlete_id:
          type: string
          description: Athlete identifier
        query_window:
          type: object
          properties:
            start_date:
              type: string
              format: date-time
            end_date:
              type: string
              format: date-time
            days:
              type: integer
        total_minutes:
          type: number
          description: Total time across all zones
        zones:
          type: object
          description: Time spent in each zone (minutes)
          properties:
            z1:
              type: number
              description: Zone 1 minutes (low aerobic)
            z2:
              type: number
              description: Zone 2 minutes (aerobic base)
            z3:
              type: number
              description: Zone 3 minutes (tempo)
            z4:
              type: number
              description: Zone 4 minutes (threshold)
            z5:
              type: number
              description: Zone 5 minutes (VO2max/anaerobic)
        percentages:
          type: object
          description: Zone distribution as percentages (sum to 100)
          properties:
            z1:
              type: number
            z2:
              type: number
            z3:
              type: number
            z4:
              type: number
            z5:
              type: number
      required:
        - athlete_id
        - zones
        - total_minutes
    EfficiencyTrends:
      type: object
      description: Efficiency trend contract with per-workout decoupling and efficiency samples plus aggregated summary statistics over the selected window.
      properties:
        athlete_id:
          type: string
          description: Athlete identifier
        query_window:
          type: object
          properties:
            start_date:
              type: string
              format: date-time
            end_date:
              type: string
              format: date-time
            days:
              type: integer
        samples:
          type: array
          description: Per-workout efficiency metrics
          items:
            type: object
            properties:
              workout_id:
                type: string
              start_time_utc:
                type: string
                format: date-time
              sport:
                type: string
              duration_min:
                type: number
              decoupling_pct:
                type: number
                description: Aerobic decoupling % (positive = efficiency declined over workout, negative = efficiency improved)
              hr_drift_bpm:
                type: number
                description: Absolute HR drift in beats per minute
              ef_overall:
                type: number
                description: Overall efficiency factor (watts/bpm or m/min/bpm)
              ef_first_half:
                type: number
              ef_second_half:
                type: number
        summary:
          type: object
          properties:
            total_samples:
              type: integer
            avg_decoupling:
              type: number
              description: Average decoupling across all workouts
      required:
        - athlete_id
        - samples
  securitySchemes:
    FunctionKey:
      type: apiKey
      in: query
      name: code
      description: Azure Functions API key passed as `?code=...`
