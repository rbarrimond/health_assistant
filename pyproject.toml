[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-assistant"
version = "3.13.6"
description = "FIT file parser for Azure Functions"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "azure-functions>=1.14.0",
    "azure-data-tables>=12.4.0",
    "azure-identity>=1.14.0",
    "azure-storage-blob>=12.19.0",
    "azure-storage-queue>=12.10.0",
    "python-dotenv>=1.0.0",
    "fitdecode>=0.10.0",
    "python-dateutil>=2.8.2",
    "numpy>=1.24.0",
    "pandas>=2.2.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "garminconnect>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "freezegun>=1.5.1",
    "debugpy>=1.8.0",
    "ipykernel>=6.29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short"
markers = [
    "integration: integration tests (skipped unless RUN_INTEGRATION=1)",
    "azure_integration: integration tests requiring Azure/Azurite (skipped unless RUN_AZURE_INTEGRATION=1)",
]

[tool.setuptools]
py-modules = ["function_app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["TrainingAnalyticsPlatform*"]
exclude = ["tests*", "htmlcov*"]
