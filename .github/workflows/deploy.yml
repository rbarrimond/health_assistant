name: Deploy to Azure Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  AZURE_FUNCTIONAPP_NAME: 'func-healthassistant-prod-59o7'

permissions:
  id-token: write  # Required for OIDC authentication
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Setup Python ${{ env.PYTHON_VERSION }}'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 'Install test dependencies'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: 'Run tests'
        run: |
          pytest tests/ --cov=FitParser --cov-report=term-missing

      - name: 'Build deployment package'
        run: |
          mkdir -p .python_packages/lib/site-packages
          pip install -r requirements.txt -t .python_packages/lib/site-packages
          zip -r functionapp.zip . -x "*.git*" "*.pytest_cache*" "tests/*" "**/__pycache__/*" ".venv/*" ".venv_test/*" "*.mypy_cache*" "*.ruff_cache*" "htmlcov/*" ".azure/*" ".coverage"

      - name: 'Upload deployment artifact'
        uses: actions/upload-artifact@v4
        with:
          name: functionapp
          path: functionapp.zip

      - name: 'Azure Login'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Functions'
        run: |
          RESOURCE_GROUP=$(az functionapp show --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --query resourceGroup -o tsv)
          az functionapp deployment source config-zip \
            --resource-group $RESOURCE_GROUP \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --src functionapp.zip

      - name: 'Deployment summary'
        run: |
          echo "✅ Deployment completed successfully"
          echo "📦 Package deployed to ${{ env.AZURE_FUNCTIONAPP_NAME }}"
